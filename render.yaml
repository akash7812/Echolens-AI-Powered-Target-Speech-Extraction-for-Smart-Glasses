# Render Blueprint Specification for Echolens
# Deploys as a native Docker Web Service on Render Cloud

services:
  - type: web
    name: echolens
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: "1"
